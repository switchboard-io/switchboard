[package]
name = "switchboard-sdk"
version = "0.0.1"
edition = "2021"
rust-version = "1.70"
description = "Local-evaluation feature-flag SDK for Rust. Real-time, offline-capable, OpenFeature-compatible. Placeholder release reserving the crate name."
license = "Apache-2.0"
homepage = "https://switchboard.co"
repository = "https://github.com/switchboard-io/switchboard"
readme = "README.md"
keywords = ["feature-flags", "openfeature", "toggles", "rollout", "experimentation"]
categories = ["config", "development-tools"]

[lib]
name = "switchboard_sdk"
path = "src/lib.rs"
