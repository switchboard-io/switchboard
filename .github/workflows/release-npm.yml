name: Release npm

# Publishes @switchboard/sdk and @switchboard/openfeature-provider to npm.
# Trigger: push a tag like `npm-v0.0.1`.
# Requires the `@switchboard` npm org and NPM_TOKEN secret.

on:
  push:
    tags: ["npm-v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [js, js-openfeature]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: sdk/${{ matrix.pkg }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
