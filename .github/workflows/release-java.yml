name: Release Java (Maven Central)

# Publishes io.github.switchboard-io:sdk and :openfeature-provider to Maven Central
# via the Central Publisher Portal / OSSRH.
# Trigger: push a tag like `java-v0.0.1`.
# Requires: MAVEN_USERNAME, MAVEN_PASSWORD (Central token) and GPG signing key
# (MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE). Namespace io.github.switchboard-io
# is verified by proving ownership of the GitHub org.

on:
  push:
    tags: ["java-v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [java, java-openfeature]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy
        working-directory: sdk/${{ matrix.pkg }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B deploy -DskipTests
