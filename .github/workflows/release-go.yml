name: Release Go (tag)

# Go modules have no central registry — "publishing" means creating a version tag
# that proxy.golang.org and pkg.go.dev can index. The module path is the repo path:
#   github.com/switchboard-io/switchboard-go
# NOTE: The Go SDK lives in its own repo (switchboard-io/switchboard-go). This
# workflow validates the build and warms the module proxy when a `go-v*` tag is pushed.
# Trigger: push a tag like `go-v0.0.1`.

on:
  push:
    tags: ["go-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build
        working-directory: sdk/go
        run: go build ./...
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
