name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build & pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build -c Release
      - run: dotnet pack -c Release -o ./artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

  node:
    name: npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate SDK
        working-directory: sdk/js
        run: node -e "import('./index.js').then(m=>console.log(m.about()))"
      - name: Validate provider
        working-directory: sdk/js-openfeature
        run: node -e "import('./index.js').then(m=>console.log(m.about()))"

  python:
    name: Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - name: Build SDK
        working-directory: sdk/python
        run: python -m build
      - name: Build provider
        working-directory: sdk/python-openfeature
        run: python -m build

  go:
    name: Go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - working-directory: sdk/go
        run: go build ./...

  rust:
    name: Rust build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SDK
        working-directory: sdk/rust
        run: cargo build --verbose
      - name: Build provider
        working-directory: sdk/rust-openfeature
        run: cargo build --verbose

  ruby:
    name: Ruby gems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Build SDK gem
        working-directory: sdk/ruby
        run: gem build switchboard-sdk.gemspec
      - name: Build provider gem
        working-directory: sdk/ruby-openfeature
        run: gem build switchboard-openfeature.gemspec

  java:
    name: Java build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build SDK
        working-directory: sdk/java
        run: mvn -B package
      - name: Build provider
        working-directory: sdk/java-openfeature
        run: mvn -B package
