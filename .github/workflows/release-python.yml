name: Release Python (PyPI)

# Publishes switchboard-sdk and switchboard-openfeature-provider to PyPI.
# Trigger: push a tag like `python-v0.0.1`.
# Uses PyPI Trusted Publishing (OIDC) — configure the publisher on PyPI, no token needed.

on:
  push:
    tags: ["python-v*"]

permissions:
  id-token: write   # required for PyPI trusted publishing
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [python, python-openfeature]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - name: Build
        working-directory: sdk/${{ matrix.pkg }}
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/${{ matrix.pkg }}/dist
