name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "10.0.x" }
      - run: dotnet test -c Release

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "26" }
      - run: node packages/js/test/run.js

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.15" }
      - run: pip install -e packages/python
      - run: python -m unittest discover -s packages/python/tests

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path packages/rust/Cargo.toml

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27" }
      - working-directory: packages/go
        run: go test ./...

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25" }
      - name: Compile + run self-test (dependency-free)
        working-directory: packages/java
        run: |
          mkdir -p out
          javac -d out $(find src -name '*.java')
          java -ea -cp out io.github.switchboard.sdk.SelfTest

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "4.0" }
      - working-directory: packages/ruby
        run: ruby -Ilib test/test_evaluation.rb

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.15" }
      - run: python scripts/check_versions.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build server image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/dotnet/Switchboard.Server/Dockerfile
          push: false
          load: true
          tags: switchboard/all-in-one:ci
      - name: Smoke-test the container
        run: |
          docker run -d --name sb -p 8080:8080 switchboard/all-in-one:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -X POST http://localhost:8080/api/eval/welcome-banner \
            -H 'Content-Type: application/json' \
            -d '{"key":"u1","attributes":{"country":"US"}}' | tee eval.json
          grep -q '"reason":"RULE_MATCH"' eval.json
      - name: Container logs
        if: always()
        run: docker logs sb || true
      - name: Validate and build docker-compose.yml
        run: |
          docker compose config --quiet
          docker compose build
