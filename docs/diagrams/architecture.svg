<svg width="860" height="440" viewBox="0 0 860 440" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="on" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3884ff"/><stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
    <style>
      .panel { fill:#171c2b; stroke:#2c3346; stroke-width:1.5; }
      .lbl   { fill:#e8eef9; font-size:14px; font-weight:700; }
      .sub   { fill:#9aa4bd; font-size:11px; }
      .pill  { fill:#1e2438; stroke:#2c3346; }
      .pilltx{ fill:#c7cede; font-size:12px; font-weight:600; }
      .wire  { stroke:#2c3346; stroke-width:2; fill:none; }
      .flow  { stroke:#3884ff; stroke-width:2.5; fill:none; stroke-dasharray:6 10; stroke-linecap:round;
               animation:dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-32; } }
      .pulse { fill:#3ddc84; }
      .title { fill:#ffffff; font-size:18px; font-weight:800; }
      .accent{ fill:#3884ff; }
    </style>
  </defs>

  <rect width="860" height="440" rx="14" fill="#0f1320"/>

  <text x="30" y="40" class="title"><tspan class="accent">Switch</tspan>board — architecture</text>
  <text x="30" y="60" class="sub">Manage once · stream everywhere · evaluate locally · proven identical in CI</text>

  <!-- 1. Control plane -->
  <rect x="30" y="92" width="220" height="118" rx="12" class="panel"/>
  <text x="46" y="118" class="lbl">Control plane</text>
  <text x="46" y="137" class="sub">ASP.NET Core · REST + SSE</text>
  <rect x="46" y="150" width="86" height="24" rx="6" class="pill"/><text x="57" y="166" class="pilltx">Admin UI</text>
  <rect x="140" y="150" width="94" height="24" rx="6" class="pill"/><text x="151" y="166" class="pilltx">Flag store</text>
  <rect x="46" y="180" width="188" height="24" rx="6" class="pill"/><text x="57" y="196" class="pilltx">Evaluation engine (shared)</text>

  <!-- 2. Edge relay -->
  <rect x="330" y="112" width="180" height="78" rx="12" class="panel"/>
  <text x="346" y="138" class="lbl">Edge relay</text>
  <text x="346" y="157" class="sub">stream · cache · fan-out</text>
  <rect x="346" y="166" width="148" height="18" rx="5" class="pill"/><text x="357" y="179" class="pilltx" font-size="10">last-known-good snapshot</text>

  <!-- 3. SDKs -->
  <rect x="590" y="70" width="240" height="300" rx="12" class="panel"/>
  <text x="606" y="96" class="lbl">Your apps — local evaluation</text>
  <text x="606" y="114" class="sub">OpenFeature · offline-capable</text>
  <g>
    <rect x="606" y="128" width="100" height="34" rx="8" fill="url(#on)"/><text x="620" y="150" fill="#fff" font-size="13" font-weight="700">.NET</text>
    <rect x="714" y="128" width="100" height="34" rx="8" fill="#1e2438" stroke="#2c3346"/><text x="728" y="150" class="pilltx">JavaScript</text>
    <rect x="606" y="170" width="100" height="34" rx="8" fill="#1e2438" stroke="#2c3346"/><text x="620" y="192" class="pilltx">Python</text>
    <rect x="714" y="170" width="100" height="34" rx="8" fill="#1e2438" stroke="#2c3346"/><text x="728" y="192" class="pilltx">Go</text>
    <rect x="606" y="212" width="100" height="34" rx="8" fill="#1e2438" stroke="#2c3346"/><text x="620" y="234" class="pilltx">Java</text>
    <rect x="714" y="212" width="100" height="34" rx="8" fill="#1e2438" stroke="#2c3346"/><text x="728" y="234" class="pilltx">Rust</text>
  </g>
  <rect x="606" y="266" width="208" height="86" rx="10" fill="#10231a" stroke="#2bb76a" stroke-width="1.5"/>
  <text x="620" y="292" fill="#3ddc84" font-size="13" font-weight="800">✓ Conformance: 150 / 150</text>
  <text x="620" y="312" class="sub">same variation · same reason</text>
  <text x="620" y="328" class="sub">same rollout bucket, byte-identical</text>
  <text x="620" y="344" class="sub">across all six languages, every push</text>

  <!-- wires -->
  <path class="wire" d="M250 151 H330"/>
  <path class="wire" d="M510 151 H590"/>
  <path class="flow" d="M250 151 H330"/>
  <path class="flow" d="M510 151 H590"/>
  <circle r="4" class="pulse">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M250 151 H590"/>
  </circle>

  <text x="262" y="142" class="sub">flag change</text>
  <text x="524" y="142" class="sub">push (ms)</text>

  <text x="30" y="250" class="sub" font-size="12">1  Edit a flag in the control plane</text>
  <text x="30" y="272" class="sub" font-size="12">2  The relay fans the delta out over SSE in milliseconds</text>
  <text x="30" y="294" class="sub" font-size="12">3  Each SDK re-evaluates in-process — no network call per flag check</text>
  <text x="30" y="316" class="sub" font-size="12">4  On outage, SDKs fall back to the cached snapshot and keep serving</text>

  <text x="30" y="372" class="sub" font-size="11">Ships to: NuGet · npm · PyPI · crates.io · Maven Central · pkg.go.dev · RubyGems</text>
  <rect x="30" y="384" width="500" height="1" fill="#2c3346"/>
  <text x="30" y="410" class="sub" font-size="11">Apache-2.0 · self-hosted · docker compose up</text>
</svg>
