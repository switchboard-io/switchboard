<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switchboard — Admin</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <strong style="font-size:17px;"><span style="color:var(--accent)">Switch</span>board</strong>
    <span style="color:var(--muted);font-size:13px;">Admin</span>
    <span class="env"><span class="dot" id="dot"></span> connected · <span id="ver">v?</span></span>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="tools">
        <input class="search" id="search" placeholder="Search flags…" />
        <button class="btn" id="newBtn">+ New</button>
      </div>
      <div id="list"></div>
    </aside>

    <main class="main">
      <div class="empty" id="empty" style="display:none;">Select a flag to edit, or create one.</div>
      <div id="detail" style="display:none;">
        <div class="panel">
          <h2 id="detailTitle">—</h2>
          <div class="chips" id="chips"></div>
        </div>

        <div class="panel">
          <h2>Configuration</h2>
          <p class="sub">Edit the flag JSON (targeting rules, rollouts, prerequisites) and save. Changes stream live to every connected SDK.</p>
          <textarea id="editor" rows="16"></textarea>
          <div class="row">
            <button class="btn" id="saveBtn">Save</button>
            <button class="btn danger" id="deleteBtn">Delete</button>
          </div>
        </div>

        <div class="panel">
          <h2>Evaluate</h2>
          <p class="sub">Test this flag against a context using the real engine on the server.</p>
          <textarea id="ctx" rows="4">{ "key": "user-42", "attributes": { "country": "US" } }</textarea>
          <div class="row"><button class="btn" id="evalBtn">Evaluate</button></div>
          <pre class="result" id="evalResult">—</pre>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
